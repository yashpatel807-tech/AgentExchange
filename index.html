<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentExchange — The directory of tools AI agents can use and pay for</title>
<meta name="description" content="Browse MCP servers and APIs that AI agents can call — free and paid. The trust layer of agent commerce, curated and tested.">
<link rel="canonical" href="https://agentexchange.online/">
<style>
  :root{
    --paper:#F2F4F7; --ink:#101E33; --wire:#2450DB; --settle:#0B8F63;
    --tick:#C8501E; --line:#C9D2E0; --card:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
  .mono{font-family:ui-monospace,Menlo,monospace}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(242,244,247,.94);z-index:20}
  .bar{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
  .logo{font-weight:700;font-size:1.08rem}
  .logo b{color:var(--wire)}
  .navlinks{display:flex;gap:14px;align-items:center}
  .navlinks a{font-size:.86rem;color:#3A4A63;text-decoration:none;font-weight:600}
  .navlinks a.btn{background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px}
  .hero{padding:46px 0 26px;text-align:center}
  h1{font-weight:700;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:-0.02em;line-height:1.15}
  h1 .pay{color:var(--settle)}
  .sub{margin:12px auto 0;max-width:56ch;color:#3A4A63;font-size:1rem}
  .controls{display:flex;gap:10px;margin:26px 0 8px;flex-wrap:wrap}
  #search{flex:1;min-width:230px;padding:12px 14px;border:1.5px solid var(--ink);border-radius:8px;font-size:.98rem;background:var(--card)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 4px}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.82rem;cursor:pointer;font-weight:600;color:#3A4A63}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:18px 0 50px}
  .tool{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px;display:flex;flex-direction:column;gap:9px}
  .toolhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .tool h3{font-size:1.02rem}
  .price{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .price.free{background:#EAF7F1;color:var(--settle)}
  .price.paid{background:#FDF0E9;color:var(--tick)}
  .price.freemium{background:#EEF3FE;color:var(--wire)}
  .tool p{font-size:.87rem;color:#4A5A73;flex:1}
  .meta{display:flex;gap:6px;flex-wrap:wrap}
